# Books a Peloton Studios New York in-person class when the weekly release opens
# (Thursdays 12:00 PM ET). Uses the same Peloton secrets as the sync workflow.
#
# WARNING: GitHub's scheduler is best-effort and often starts cron jobs 5-30 minutes
# late at busy times. The two cron lines fire at 11:35 ET in both daylight and standard
# time; the script exits at once when the next release is more than 60 minutes away, so
# only one of them does real work. Also, Peloton's login page runs bot detection that may
# challenge a datacenter browser. Prefer running studio-booking/run.sh from a machine you
# control with a logged-in profile (see studio-booking/README.md) and keep this as backup.

name: Book Peloton Studio class

on:
  workflow_dispatch:
    inputs:
      instructor:
        description: Instructor name as shown on the schedule
        default: Becs Gentry
      class_name:
        description: Optional text that must appear in the class name (e.g. Run)
        default: ""
      class_time:
        description: Optional start time (e.g. 7:30 AM)
        default: ""
      class_day:
        description: Optional weekday (e.g. Sat)
        default: ""
      mode:
        description: live = book for real, dry-run = stop before the purchase call, now-dry-run = run immediately without waiting for Thursday
        type: choice
        options: [live, dry-run, now-dry-run]
        default: dry-run
      waitlist:
        description: Join the waitlist if the class is full
        type: boolean
        default: false
  schedule:
    - cron: '35 15 * * 4'   # 11:35 ET while US daylight time is in effect
    - cron: '35 16 * * 4'   # 11:35 ET while US standard time is in effect

concurrency:
  group: book-studio-class
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        working-directory: studio-booking
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore saved login session
        uses: actions/cache/restore@v4
        with:
          path: studio-booking/state
          key: studio-session-${{ github.run_id }}
          restore-keys: studio-session-

      - name: Book class
        id: book
        working-directory: studio-booking
        env:
          P2G_PELOTON__EMAIL: ${{ secrets.P2G_PELOTON__EMAIL }}
          P2G_PELOTON__PASSWORD: ${{ secrets.P2G_PELOTON__PASSWORD }}
          NOTIFY_URL: ${{ secrets.STUDIO_NOTIFY_URL }}
          STUDIO_INSTRUCTOR: ${{ github.event.inputs.instructor || 'Becs Gentry' }}
          STUDIO_CLASS_NAME: ${{ github.event.inputs.class_name }}
          STUDIO_CLASS_TIME: ${{ github.event.inputs.class_time }}
          STUDIO_CLASS_DAY: ${{ github.event.inputs.class_day }}
          STUDIO_WAITLIST: ${{ github.event.inputs.waitlist || 'false' }}
          MODE: ${{ github.event.inputs.mode || 'live' }}
          TZ: America/New_York
        run: |
          set +e
          if [ -z "$P2G_PELOTON__EMAIL" ] || [ -z "$P2G_PELOTON__PASSWORD" ]; then
            echo "::error::P2G_PELOTON__EMAIL / P2G_PELOTON__PASSWORD secrets are not set"; exit 1
          fi
          ARGS="--discover"
          case "$MODE" in
            dry-run)     ARGS="$ARGS --dry-run" ;;
            now-dry-run)
              # look at the already-published week so the run actually finds classes
              ARGS="$ARGS --dry-run --now --poll-seconds 20 --window-start $(date +%F) --window-end $(date -d '+7 days' +%F)" ;;
          esac
          python book_studio_class.py $ARGS
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          case $rc in
            0) echo "::notice::Booked (or waitlisted)";;
            2) echo "::warning::Release polled but no spot obtained";;
            3) echo "No release within the wait window at this run time; nothing to do";;
            *) echo "::error::Booker failed with exit $rc";;
          esac
          [ $rc -eq 0 ] || [ $rc -eq 2 ] || [ $rc -eq 3 ]

      - name: Save login session
        if: always() && steps.book.outputs.exit_code != '3'
        uses: actions/cache/save@v4
        with:
          path: studio-booking/state
          key: studio-session-${{ github.run_id }}

      - name: Upload screenshots and API log
        if: always() && steps.book.outputs.exit_code != '3'
        uses: actions/upload-artifact@v4
        with:
          name: studio-booking-${{ github.run_id }}
          path: studio-booking/out
          if-no-files-found: ignore
          retention-days: 14
